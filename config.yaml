# ==============================================================================
# Bluesky Political Network Panel Collector Configuration
# Target: 2026 Michigan Senate Race (Abdul El-Sayed vs. Mike Rogers)
# ==============================================================================

# Database & File Storage Settings
storage:
  db_path: "/data/bluesky_panel.sqlite"
  raw_snapshots_dir: "/data/raw_snapshots"
  logs_dir: "/data/logs"

# Seeder Configuration
seeder:
  # 1. Direct candidate follower ingestion (explicitly tagged as entry_method: 'candidate_follower')
  candidate_follower_seeds:
    - handle: "abdulelsayed.bsky.social"
      max_followers: null  # null pulls all ~58,500 followers

  # 2. Michigan news hubs and civic bridge accounts (tagged as entry_method: 'press_hub')
  seed_accounts:
    - "bridgemi.com"
    - "freep.com"
    - "detroitnews.com"
    - "michiganpublic.bsky.social"
  
  # How many recent posts from each seed account to crawl for repliers and reposters
  seed_account_post_crawl_limit: 30

  # 3. Search queries for discovering nodes across the Michigan political spectrum (tagged as entry_method: 'keyword_search')
  queries:
    - "Abdul El-Sayed"
    - "El-Sayed Senate"
    - "Mike Rogers"
    - "Rogers Senate"
    - "Rogers Michigan"
    - "Michigan Senate"
    - "MI Senate"
    - "MISen"
    - "MISenate"
    - "MichiganPolitics"
    - "MIGOP"
    - "Michigan GOP"
    - "Michigan Dems"
    - "MIDems"
    - "Bridge Michigan"

  # How many days back to search
  since_days: 30
  # Maximum posts to retrieve per query term during seeding
  max_posts_per_query: 500
  # Whether to fetch replies and reposts to expand tier nodes
  fetch_replies: true
  fetch_reposts: true
  # Bot detection heuristics
  bot_heuristics:
    flag_high_following_ratio: true
    min_following_for_ratio_check: 200
    max_followers_for_suspicious: 5
    flag_empty_profile: true

# Firehose Listener Configuration
firehose:
  relay_url: "wss://bsky.network/xrpc/com.atproto.sync.subscribeRepos"
  did_reload_interval_seconds: 300
  checkpoint_interval_seconds: 15
  reconnect_min_delay: 2
  reconnect_max_delay: 60

# Daily Follows Snapshot Configuration
snapshot:
  api_base_url: "https://api.bsky.app"
  schedule_time_utc: "03:00"
  run_interval_hours: 24
  page_size: 100
  concurrency: 10
  request_delay_seconds: 0.05
  max_retries: 5
  base_backoff_seconds: 2.0

# Post Collector Configuration
post_collector:
  api_base_url: "https://api.bsky.app"
  schedule_time_utc: "04:00"
  run_interval_hours: 24
  initial_lookback_days: 30
  max_posts_per_account: 100
  concurrency: 10
  request_delay_seconds: 0.05

# Monitor UI Dashboard Settings
monitor:
  host: "0.0.0.0"
  port: 8133
  auto_refresh_seconds: 60
